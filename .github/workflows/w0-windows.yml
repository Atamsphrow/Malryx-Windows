# W0 Malryx for Windows - a lancer MANUELLEMENT (workflow_dispatch) si on
# choisit la voie GitHub Actions : Elri execute alors les verifications sur
# un vrai Windows Server du runner, sans toucher au PC d'Atamsphrow.
# Rien ne se declenche tout seul (pas de push/pull_request).
name: w0-windows

on:
  workflow_dispatch:

jobs:
  w0:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter (installe par le runner ou le SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter doctor (Visual Studio du runner)
        shell: pwsh
        run: flutter doctor -v

      - name: yara-python 4.5.4 (wheel win_amd64 verifiee sur PyPI)
        shell: pwsh
        run: |
          python -m pip install "yara-python==4.5.4"
          python tools/yara_test.py

      - name: Prototype ReadDirectoryChangesW
        shell: pwsh
        run: python tools/rdw_test.py

      - name: Authenticode
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:SystemRoot\explorer.exe"
          Write-Host $sig.Status
          if ($sig.Status -ne "Valid") { exit 1 }

      # ClamAV : installation via Chocolatey (preinstalle sur le runner),
      # configuration TCP minimale, freshclam, demarrage de clamd, puis
      # test zPING -> PONG via tools/clamd_tcp_test.py.
      # continue-on-error : un echec ici laisse le run vert mais le
      # verdict clamd reste ACTION dans le rapport (jamais maquille).
      - name: ClamAV (installation + test TCP reel)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install clamav -y --no-progress
          $clamd = Get-ChildItem -Path "C:\Program Files\ClamAV","C:\ProgramData\chocolatey\lib" -Filter clamd.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clamd) { Write-Host "ECHEC: clamd.exe introuvable apres installation"; exit 1 }
          $clamDir = $clamd.Directory.FullName
          Write-Host "clamd trouve : $($clamd.FullName)"
          $db = "C:\ProgramData\ClamAV\db"
          New-Item -ItemType Directory -Force $db | Out-Null
          $dbConf = $db -replace "\\","/"
          @("DatabaseDirectory $dbConf","TCPSocket 3310","TCPAddr 127.0.0.1","LogFile C:/ProgramData/ClamAV/clamd.log","Foreground yes") | Out-File "$clamDir\clamd.conf" -Encoding ascii
          @("DatabaseDirectory $dbConf","DatabaseMirror database.clamav.net","Checks 1") | Out-File "$clamDir\freshclam.conf" -Encoding ascii
          & "$clamDir\freshclam.exe" --config-file="$clamDir\freshclam.conf"
          Start-Process -FilePath $clamd.FullName -ArgumentList "--config-file=`"$clamDir\clamd.conf`"" -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..24) { Start-Sleep -Seconds 5; try { $t = Test-NetConnection -ComputerName 127.0.0.1 -Port 3310 -WarningAction SilentlyContinue; if ($t.TcpTestSucceeded) { $ok = $true; break } } catch {} }
          if (-not $ok) { Write-Host "ECHEC: port 3310 jamais ouvert"; exit 1 }
          python tools/clamd_tcp_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "CLAMD_TCP_VERDICT: PASS"
