# W0 Malryx for Windows - a lancer MANUELLEMENT (workflow_dispatch) si on
# choisit la voie GitHub Actions : Elri execute alors les verifications sur
# un vrai Windows Server du runner, sans toucher au PC d'Atamsphrow.
# Rien ne se declenche tout seul (pas de push/pull_request).
name: w0-windows

on:
  workflow_dispatch:

jobs:
  w0:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter (installe par le runner ou le SDK)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter doctor (Visual Studio du runner)
        shell: pwsh
        run: flutter doctor -v

      - name: yara-python 4.5.4 (wheel win_amd64 verifiee sur PyPI)
        shell: pwsh
        run: |
          python -m pip install "yara-python==4.5.4"
          python tools/yara_test.py

      - name: Prototype ReadDirectoryChangesW
        shell: pwsh
        run: python tools/rdw_test.py

      - name: Authenticode
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:SystemRoot\explorer.exe"
          Write-Host $sig.Status
          if ($sig.Status -ne "Valid") { exit 1 }

      # ClamAV : pas d'URL d'installeur figee ici (volontaire : ne jamais
      # deviner une URL de telechargement). Etape informative seulement ;
      # le vrai test clamd TCP se fait apres installation officielle
      # (clamav.net) via tools/clamd_tcp_test.py.
      - name: ClamAV (informatif)
        shell: pwsh
        continue-on-error: true
        run: |
          $c = Get-Command clamd.exe -ErrorAction SilentlyContinue
          if ($c) { Write-Host "clamd present : $($c.Source)" }
          else { Write-Host "clamd absent du runner - installation manuelle requise (voir W0_RAPPORT.md)" }
