# Sonde ponctuelle W3 : chronometrage par moteur (workflow_dispatch only).
name: probe-engines

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances backend
        shell: pwsh
        run: python -m pip install -r backend/requirements.txt

      - name: ClamAV (installation + demarrage TCP)
        shell: pwsh
        run: |
          choco install clamav -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "ECHEC: choco install clamav"; exit 1 }
          $db = "C:\ProgramData\ClamAV\db"
          New-Item -ItemType Directory -Force -Path $db | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\ClamAV" | Out-Null
          $dbConf = $db -replace '\\','/'
          $clamd = Get-ChildItem -Path "C:\Program Files\ClamAV","C:\ProgramData\chocolatey\lib" -Filter clamd.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clamd) { Write-Host "ECHEC: clamd.exe introuvable apres installation"; exit 1 }
          $clamDir = $clamd.Directory.FullName
          @("DatabaseDirectory $dbConf","TCPSocket 3310","TCPAddr 127.0.0.1","LogFile C:/ProgramData/ClamAV/clamd.log","Foreground yes") | Out-File "$clamDir\clamd.conf" -Encoding ascii
          @("DatabaseDirectory $dbConf","DatabaseMirror database.clamav.net","Checks 1") | Out-File "$clamDir\freshclam.conf" -Encoding ascii
          try { Add-MpPreference -ExclusionPath $clamDir,$db -ErrorAction Stop; Write-Host "exclusions Defender posees" } catch { Write-Host "exclusions Defender impossibles : $_" }
          & "$clamDir\freshclam.exe" --config-file="$clamDir\freshclam.conf"
          Start-Process -FilePath $clamd.FullName -ArgumentList "--config-file=`"$clamDir\clamd.conf`"" -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..20) {
            python tools/clamd_tcp_test.py 127.0.0.1 3310 5
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "--- attente clamd, essai $i/20"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { Write-Host "ECHEC: clamd sans PONG apres 600 s"; exit 1 }
          Write-Host "CLAMD_TCP_VERDICT: PASS"

      - name: Sonde moteurs
        shell: pwsh
        run: python -u tools/engine_probe.py
